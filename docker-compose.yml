# Full stack:   docker compose up -d --build
# Dev (DB only, run api/web with bun):   docker compose up -d db
services:
  db:
    image: timescale/timescaledb:2.17.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: snake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snake}
      POSTGRES_DB: snake
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snake"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://snake:${POSTGRES_PASSWORD:-snake}@db:5432/snake
      PORT: "3000"
      # Public origin of the site; the API is served under /api behind Caddy.
      PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost}/api
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
