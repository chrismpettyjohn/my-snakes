# Database only. The API runs with bun and the web app is served from apps/web/dist.
#   docker compose up -d
# POSTGRES_PASSWORD is read from apps/api/.env (keep it in sync with DATABASE_URL).
services:
  db:
    image: timescale/timescaledb:2.17.2-pg17
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      POSTGRES_USER: snake
      POSTGRES_DB: snake
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snake"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
